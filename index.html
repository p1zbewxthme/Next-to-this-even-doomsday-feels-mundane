<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fbe8c8" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>우리가 구사했던 사랑을 기억해?</title>
  <style>
    :root{
      --accent:#fa243c;
      --warm:#9b6818;
      --text:#111111;
      --sub:#77736d;
      --line:rgba(60,60,67,.16);
      --glass:rgba(252,251,249,.90);
      --safe-t:env(safe-area-inset-top,0px);
      --safe-b:env(safe-area-inset-bottom,0px);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;background:#000;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
    body{min-height:100dvh;overflow:hidden}
    button{font:inherit;color:inherit}
    button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    svg{display:block}

    .stage{
      width:100%;height:100dvh;min-height:-webkit-fill-available;
      display:flex;align-items:center;justify-content:center;
      padding:18px;background:#000;
    }
    .phone{
      position:relative;width:min(100%,430px);height:min(920px,calc(100dvh - 36px));
      background:#fff;border:10px solid #242529;border-radius:58px;overflow:hidden;
      box-shadow:0 20px 70px rgba(0,0,0,.42);isolation:isolate;
    }
    .screen{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,#fbe8c8 0%,#fff8ed 31%,#fff 68%,#fff 100%)}

    .dynamic-island{
      position:absolute;z-index:30;top:10px;left:50%;transform:translateX(-50%);
      width:126px;height:34px;border-radius:24px;background:#000;pointer-events:none;
    }
    .status{
      position:relative;z-index:20;height:50px;padding:14px 24px 0;
      display:flex;align-items:center;justify-content:space-between;
      font-size:13px;font-weight:700;user-select:none;color:#0a0a0a;
    }
    .status-right{display:flex;align-items:center;gap:8px}
    .signal{display:flex;align-items:flex-end;gap:2px;height:13px}
    .signal i{display:block;width:3px;background:#0a0a0a;border-radius:1px}
    .signal i:nth-child(1){height:5px}.signal i:nth-child(2){height:7px}.signal i:nth-child(3){height:10px}.signal i:nth-child(4){height:13px}
    .battery{width:22px;height:11px;border:1.5px solid rgba(0,0,0,.55);border-radius:3px;position:relative;padding:1px}
    .battery:after{content:"";position:absolute;right:-3px;top:3px;width:2px;height:5px;border-radius:0 1px 1px 0;background:rgba(0,0,0,.38)}
    .battery-fill{height:100%;width:100%;border-radius:1.5px;background:#35c85a}

    .nav{
      position:relative;z-index:20;height:56px;padding:0 18px;
      display:flex;align-items:center;justify-content:space-between;
    }
    .nav-right{display:flex;align-items:center;gap:2px;padding:2px 6px;border-radius:28px;background:rgba(229,217,196,.46)}
    .circle-btn,.nav-btn,.mini-btn{
      border:0;background:transparent;display:grid;place-items:center;cursor:pointer;touch-action:manipulation;
    }
    .nav-btn{width:44px;height:44px;border-radius:50%}
    .nav-left{background:rgba(229,217,196,.46)}
    .nav-btn svg{width:25px;height:25px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}

    .scroll{
      position:absolute;left:0;right:0;top:106px;bottom:112px;
      overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;
      touch-action:pan-y;padding:4px 22px 38px;scrollbar-width:none;
    }
    .scroll::-webkit-scrollbar{display:none}

    .hero{padding:4px 0 4px;text-align:center}
    .cover{
      display:block;width:min(68vw,270px);aspect-ratio:1;object-fit:cover;
      margin:0 auto 14px;border-radius:10px;background:#ddd;
      box-shadow:0 7px 20px rgba(0,0,0,.10);
    }
    .playlist-title{margin:0;font-size:27px;line-height:1.18;font-weight:800;letter-spacing:-.035em}
    .playlist-artist{margin:5px 0 0;font-size:16px;line-height:1.25;color:#77736d;font-weight:400}

    .actions{
      display:grid;grid-template-columns:48px minmax(0,1fr) 48px;align-items:center;gap:14px;
      width:min(100%,326px);margin:18px auto 17px;
    }
    .action-round,.action-play{
      border:0;background:rgba(229,217,196,.43);height:48px;cursor:pointer;touch-action:manipulation;
    }
    .action-round{width:48px;border-radius:50%;display:grid;place-items:center}
    .action-round svg{width:24px;height:24px;stroke:#111;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .action-round.active svg{stroke:var(--accent)}
    .action-play{
      min-width:0;border-radius:25px;color:var(--accent);font-size:17px;font-weight:700;
      display:flex;align-items:center;justify-content:center;gap:7px;
    }
    .action-play svg{width:20px;height:20px;fill:currentColor}

    .tracks{border-top:1px solid var(--line)}
    .track{
      position:relative;width:100%;min-height:66px;padding:7px 0;
      display:grid;grid-template-columns:45px minmax(0,1fr) 28px;gap:10px;align-items:center;
      border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;
      touch-action:pan-y;
    }
    .track:active{background:rgba(118,118,128,.06)}
    .track-art{width:45px;height:45px;border-radius:5px;object-fit:cover;background:#e5e5e7}
    .track-meta{display:block;min-width:0;align-self:center}
    .track-title,.track-artist{display:block;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .track-title{font-size:16px;line-height:1.2;font-weight:450;letter-spacing:-.015em;color:#161616}
    .track-artist{margin-top:4px;font-size:13.5px;line-height:1.15;color:var(--warm);font-weight:400}
    .track-more{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;color:var(--warm)}
    .track-more span{font-size:20px;font-weight:800;line-height:0;transform:translateY(-2px);letter-spacing:1px}
    .track-star{position:absolute;left:-18px;bottom:6px;font-size:14px;line-height:1;color:var(--warm)}
    .track.active .track-title{color:var(--accent)}
    .track.active .track-artist{color:var(--accent)}

    .bottom-ui{
      position:absolute;z-index:25;left:0;right:0;bottom:0;padding-bottom:var(--safe-b);
      background:var(--glass);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
      border-top:1px solid rgba(60,60,67,.13);
    }
    .mini{
      height:58px;margin:0 12px 0;padding:5px 8px 5px 10px;
      display:flex;align-items:center;gap:10px;border-radius:18px 18px 0 0;
      border:1px solid rgba(60,60,67,.12);border-bottom:0;background:rgba(255,255,255,.58);
    }
    .mini-art{width:39px;height:39px;border-radius:5px;object-fit:cover;background:#ddd;flex:none}
    .mini-meta{min-width:0;flex:1}
    .mini-title{font-size:15px;font-weight:650;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .mini-artist{margin-top:3px;font-size:12.5px;color:#77736d;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .mini-controls{display:flex;align-items:center;gap:2px}
    .mini-btn{width:38px;height:38px;border-radius:50%}
    .mini-btn svg{width:24px;height:24px;fill:#050505;stroke:#050505;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .mini-btn.play-pause svg{width:22px;height:22px}

    .tabs{height:54px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:1px 8px 3px}
    .tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--warm);font-size:9.5px;font-weight:500;min-width:0}
    .tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .tab.active{color:var(--accent);background:rgba(118,118,128,.08);border-radius:18px;padding:4px 0}
    .tab.active svg{fill:currentColor;stroke:currentColor}

    /* 실제 재생 엔진. 화면에는 노출하지 않되 iframe은 정상 크기로 유지한다. */
    .yt-engine{position:fixed;left:-10000px;top:0;width:200px;height:200px;opacity:.01;pointer-events:none;overflow:hidden}
    #yt-player,.yt-engine iframe{width:200px!important;height:200px!important;border:0}

    .toast{
      position:absolute;z-index:50;left:50%;bottom:124px;transform:translate(-50%,12px);
      max-width:calc(100% - 40px);padding:9px 13px;border-radius:18px;background:rgba(22,22,22,.88);color:#fff;
      font-size:12.5px;line-height:1.35;opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;
      text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .toast.show{opacity:1;transform:translate(-50%,0)}
    .loading,.error{padding:32px 18px;text-align:center;color:#77736d;line-height:1.55;font-size:14px}
    .error strong{display:block;color:#111;margin-bottom:7px}

    @media (max-width:600px){
      html,body{background:#fff}
      .stage{padding:0;background:#fff;display:block}
      .phone{width:100%;height:100dvh;max-height:none;border:0;border-radius:0;box-shadow:none}
      .dynamic-island{display:none}
      .status{height:calc(48px + var(--safe-t));padding-top:calc(12px + var(--safe-t));padding-left:20px;padding-right:20px}
      .nav{height:54px;padding-left:16px;padding-right:16px}
      .scroll{top:calc(102px + var(--safe-t));bottom:calc(112px + var(--safe-b));padding-left:20px;padding-right:20px}
      .cover{width:min(68vw,286px)}
      .playlist-title{font-size:clamp(24px,6.8vw,29px)}
      .playlist-artist{font-size:clamp(15px,4vw,17px)}
      .track{min-height:68px}
      .track-art{width:47px;height:47px}
      .track-star{left:-17px}
      .toast{bottom:calc(124px + var(--safe-b))}
    }
    @media (max-width:360px){
      .scroll{padding-left:16px;padding-right:16px}
      .actions{gap:10px}
      .playlist-title{font-size:23px}
      .track-title{font-size:15px}
      .track-artist{font-size:12.5px}
    }
    @media (prefers-reduced-motion:reduce){.toast{transition:none}}
  </style>
</head>
<body>
  <main class="stage">
    <section class="phone" aria-label="Apple Music 스타일 재생목록">
      <div class="screen">
        <div class="dynamic-island" aria-hidden="true"></div>

        <header class="status" aria-hidden="true">
          <span id="clock">9:41</span>
          <span class="status-right">
            <span class="signal"><i></i><i></i><i></i><i></i></span>
            <svg width="18" height="14" viewBox="0 0 24 18" aria-hidden="true"><path d="M2 6.5C7.6 1.8 16.4 1.8 22 6.5M6 10.5c3.4-2.8 8.6-2.8 12 0M10 14.5c1.2-1 2.8-1 4 0" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round"/></svg>
            <span class="battery"><span class="battery-fill"></span></span>
          </span>
        </header>

        <nav class="nav" aria-label="상단 메뉴">
          <button class="nav-btn nav-left" type="button" id="backBtn" aria-label="뒤로">
            <svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8"/></svg>
          </button>
          <div class="nav-right">
            <button class="nav-btn" type="button" id="personBtn" aria-label="사람 추가">
              <svg viewBox="0 0 24 24"><path d="M9.5 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/><path d="M2.5 20c.6-4.2 3.1-6.2 7-6.2s6.4 2 7 6.2"/><path d="M19 7v6M16 10h6"/></svg>
            </button>
            <button class="nav-btn" type="button" id="shareBtn" aria-label="공유">
              <svg viewBox="0 0 24 24"><path d="M12 16V3M8 7l4-4 4 4"/><path d="M5 11v9h14v-9"/></svg>
            </button>
            <button class="nav-btn" type="button" aria-label="더 보기">
              <svg viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg>
            </button>
          </div>
        </nav>

        <div class="scroll" id="scrollPane">
          <div id="app"><div class="loading">재생목록을 불러오는 중…</div></div>
        </div>

        <footer class="bottom-ui">
          <div class="mini" id="miniPlayer">
            <img class="mini-art" id="miniArt" alt="" />
            <div class="mini-meta">
              <div class="mini-title" id="miniTitle">곡을 선택해 주세요</div>
              <div class="mini-artist" id="miniArtist">재생목록</div>
            </div>
            <div class="mini-controls">
              <button class="mini-btn play-pause" id="miniToggle" type="button" aria-label="재생 또는 일시정지"></button>
              <button class="mini-btn" id="miniNext" type="button" aria-label="다음 곡">
                <svg viewBox="0 0 24 24"><path d="M4 5v14l10-7L4 5Z"/><path d="M16 5v14" fill="none"/></svg>
              </button>
            </div>
          </div>
          <div class="tabs" aria-hidden="true">
            <span class="tab"><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7v9H15v-6H9v6H3Z"/></svg><span>홈</span></span>
            <span class="tab"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg><span>새로운 음악</span></span>
            <span class="tab"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 16 0M7 12v4M17 12v4"/><path d="M12 12v7"/></svg><span>라디오</span></span>
            <span class="tab active"><svg viewBox="0 0 24 24"><path d="M8 4h10v15H8z"/><path d="M5 7h3"/></svg><span>보관함</span></span>
            <span class="tab"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg><span>검색</span></span>
          </div>
        </footer>

        <div class="toast" id="toast" role="status" aria-live="polite"></div>
        <div class="yt-engine" aria-hidden="true"><div id="yt-player"></div></div>
      </div>
    </section>
  </main>

<script>
(() => {
  'use strict';

  const JSON_URL = './apple-music-maker.json';
  const app = document.getElementById('app');
  const miniArt = document.getElementById('miniArt');
  const miniTitle = document.getElementById('miniTitle');
  const miniArtist = document.getElementById('miniArtist');
  const miniToggle = document.getElementById('miniToggle');
  const miniNext = document.getElementById('miniNext');
  const toast = document.getElementById('toast');

  let data = null;
  let originalTracks = [];
  let queueTracks = [];
  let currentQueueIndex = -1;
  let currentTrackId = null;
  let shuffleMode = false;

  let ytPlayer = null;
  let ytReady = false;
  let apiRequested = false;
  let pendingVideoId = '';
  let pendingAutoplay = false;
  let isPlaying = false;
  let toastTimer = null;

  const esc = value => String(value ?? '').replace(/[&<>'"]/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'
  }[c]));

  function videoId(url) {
    if (!url) return '';
    try {
      const u = new URL(url, location.href);
      const host = u.hostname.replace(/^www\./, '');
      if (host === 'youtu.be') return u.pathname.split('/').filter(Boolean)[0] || '';
      if (host.endsWith('youtube.com')) {
        if (u.searchParams.get('v')) return u.searchParams.get('v');
        const parts = u.pathname.split('/').filter(Boolean);
        const marker = parts.findIndex(p => ['embed','shorts','live'].includes(p));
        if (marker >= 0 && parts[marker + 1]) return parts[marker + 1];
      }
    } catch (_) {}
    return '';
  }

  function iconPlay() {
    return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15L19 12 7 4.5Z"/></svg>';
  }
  function iconPause() {
    return '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>';
  }
  function updatePlayPauseIcon() {
    miniToggle.innerHTML = isPlaying ? iconPause() : iconPlay();
    miniToggle.setAttribute('aria-label', isPlaying ? '일시정지' : '재생');
  }

  function showToast(message) {
    clearTimeout(toastTimer);
    toast.textContent = message;
    toast.classList.add('show');
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1900);
  }

  function fisherYates(items) {
    const a = [...items];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function render() {
    const pl = data.pl || {};
    originalTracks = Array.isArray(data.tracks) ? [...data.tracks] : [];
    queueTracks = [...originalTracks];

    document.documentElement.style.setProperty('--accent', data.tab?.accent || '#fa243c');
    document.title = pl.title || '재생목록';
    document.getElementById('clock').textContent = data.status?.time || '9:41';

    app.innerHTML = `
      <section class="hero">
        <img class="cover" src="${pl.img || ''}" alt="${esc(pl.title || '재생목록')} 표지" />
        <h1 class="playlist-title">${esc(pl.title || '')}</h1>
        <p class="playlist-artist">${esc(pl.artist || '')}</p>
      </section>

      <div class="actions" aria-label="재생목록 동작">
        <button class="action-round" type="button" id="shuffleBtn" aria-label="임의 재생" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M3 7h3.5c4 0 5 10 9 10H21"/><path d="m17 13 4 4-4 4"/><path d="M3 17h3.5c1.8 0 3-2 4.1-4.1"/><path d="M13.3 8.2C14 7.5 14.7 7 15.5 7H21"/><path d="m17 3 4 4-4 4"/></svg>
        </button>
        <button class="action-play" type="button" id="playFirstBtn">${iconPlay()}<span>${esc(data.act?.label || '재생')}</span></button>
        <button class="action-round" type="button" id="downloadBtn" aria-label="다운로드">
          <svg viewBox="0 0 24 24"><path d="M12 3v12M7.5 10.5 12 15l4.5-4.5"/><path d="M5 20h14"/></svg>
        </button>
      </div>

      <section class="tracks" id="tracks" aria-label="곡 목록"></section>`;

    renderTracks();

    document.getElementById('playFirstBtn').addEventListener('click', playFromBeginning);
    document.getElementById('shuffleBtn').addEventListener('click', shuffleAndPlay);
    document.getElementById('downloadBtn').addEventListener('click', () => {
      showToast('웹 재생기에서는 오프라인 다운로드를 지원하지 않습니다.');
    });

    const mini = data.mini || {};
    miniArt.src = mini.img || pl.img || originalTracks[0]?.img || '';
    miniTitle.textContent = mini.title || originalTracks[0]?.title || '곡을 선택해 주세요';
    miniArtist.textContent = mini.artist || originalTracks[0]?.artist || pl.artist || '재생목록';
    updatePlayPauseIcon();
  }

  function renderTracks() {
    const tracksEl = document.getElementById('tracks');
    if (!tracksEl) return;

    tracksEl.innerHTML = queueTracks.map((track, index) => `
      <button class="track${track.id === currentTrackId ? ' active' : ''}" type="button" data-index="${index}" aria-label="${esc(track.title)} — ${esc(track.artist)} 재생" ${track.id === currentTrackId ? 'aria-current="true"' : ''}>
        ${track.star ? '<span class="track-star" aria-label="즐겨찾기">★</span>' : ''}
        <img class="track-art" src="${track.img || ''}" alt="" loading="lazy" decoding="async" />
        <span class="track-meta">
          <span class="track-title">${esc(track.title || '')}</span>
          <span class="track-artist">${esc(track.artist || '')}</span>
        </span>
        <span class="track-more" aria-hidden="true"><span>•••</span></span>
      </button>
    `).join('');

    tracksEl.querySelectorAll('.track').forEach(el => {
      el.addEventListener('click', () => playQueueIndex(Number(el.dataset.index)));
    });
  }

  function setCurrent(index) {
    const track = queueTracks[index];
    if (!track) return;
    currentQueueIndex = index;
    currentTrackId = track.id;

    miniArt.src = track.img || data.pl?.img || '';
    miniTitle.textContent = track.title || '';
    miniArtist.textContent = track.artist || '';

    document.querySelectorAll('.track').forEach((el, i) => {
      const active = i === index;
      el.classList.toggle('active', active);
      if (active) el.setAttribute('aria-current', 'true');
      else el.removeAttribute('aria-current');
    });
  }

  function playFromBeginning() {
    // 현재 화면에 표시된 목록의 첫 곡부터 재생한다.
    // 셔플 상태라면 셔플된 순서를 그대로 유지한다.
    if (queueTracks.length) playQueueIndex(0);
  }

  function shuffleAndPlay() {
    shuffleMode = true;
    queueTracks = fisherYates(originalTracks);

    // 셔플 결과가 원래 순서와 완전히 같아 보이는 드문 경우를 한 번 더 섞는다.
    if (queueTracks.length > 1 && queueTracks.every((t, i) => t.id === originalTracks[i]?.id)) {
      queueTracks = fisherYates(originalTracks);
    }

    currentQueueIndex = -1;
    currentTrackId = null;
    renderTracks();
    updateShuffleButton();
    showToast('재생목록을 임의 순서로 섞었습니다.');
    if (queueTracks.length) playQueueIndex(0);
  }

  function updateShuffleButton() {
    const btn = document.getElementById('shuffleBtn');
    if (!btn) return;
    btn.classList.toggle('active', shuffleMode);
    btn.setAttribute('aria-pressed', shuffleMode ? 'true' : 'false');
  }

  function playMiniTrack() {
    const mini = data?.mini || {};
    const id = videoId(mini.yt);

    if (!id) {
      showToast('Amen에는 재생 가능한 YouTube 링크가 없습니다.');
      return;
    }

    currentQueueIndex = -1;
    currentTrackId = '__mini__';
    miniArt.src = mini.img || data.pl?.img || '';
    miniTitle.textContent = mini.title || 'Amen';
    miniArtist.textContent = mini.artist || '';

    document.querySelectorAll('.track').forEach(el => {
      el.classList.remove('active');
      el.removeAttribute('aria-current');
    });

    pendingVideoId = id;
    pendingAutoplay = true;
    isPlaying = true;
    updatePlayPauseIcon();

    if (ytReady && ytPlayer) {
      try {
        ytPlayer.loadVideoById(id);
        ytPlayer.playVideo();
        pendingVideoId = '';
        pendingAutoplay = false;
      } catch (_) {
        showToast('재생기를 준비하는 중입니다. 잠시 후 다시 눌러 주세요.');
      }
    } else {
      loadYouTubeAPI();
    }
  }

  function playQueueIndex(index) {
    if (!queueTracks.length) return;
    const normalized = (index + queueTracks.length) % queueTracks.length;
    const track = queueTracks[normalized];
    const id = videoId(track?.yt);

    if (!id) {
      showToast('이 곡에는 재생 가능한 YouTube 링크가 없습니다.');
      return;
    }

    setCurrent(normalized);
    pendingVideoId = id;
    pendingAutoplay = true;
    isPlaying = true;
    updatePlayPauseIcon();

    if (ytReady && ytPlayer) {
      try {
        ytPlayer.loadVideoById(id);
        ytPlayer.playVideo();
        pendingVideoId = '';
        pendingAutoplay = false;
      } catch (_) {
        showToast('재생기를 준비하는 중입니다. 잠시 후 다시 눌러 주세요.');
      }
    } else {
      loadYouTubeAPI();
    }
  }

  function playNext() {
    if (!queueTracks.length) return;
    if (currentQueueIndex < 0) {
      playQueueIndex(0);
      return;
    }
    playQueueIndex((currentQueueIndex + 1) % queueTracks.length);
  }

  function playPrevious() {
    if (!queueTracks.length) return;
    if (currentQueueIndex < 0) {
      playQueueIndex(0);
      return;
    }
    playQueueIndex((currentQueueIndex - 1 + queueTracks.length) % queueTracks.length);
  }

  function loadYouTubeAPI() {
    if (window.YT?.Player) {
      createPlayer();
      return;
    }
    if (apiRequested) return;
    apiRequested = true;
    const script = document.createElement('script');
    script.src = 'https://www.youtube.com/iframe_api';
    script.async = true;
    script.id = 'youtube-iframe-api';
    script.onerror = () => showToast('YouTube 재생기를 불러오지 못했습니다.');
    document.head.appendChild(script);
  }

  window.onYouTubeIframeAPIReady = createPlayer;

  function createPlayer() {
    if (ytPlayer || !window.YT?.Player) return;
    ytPlayer = new YT.Player('yt-player', {
      width: 200,
      height: 200,
      playerVars: {
        playsinline: 1,
        controls: 0,
        rel: 0,
        fs: 0,
        disablekb: 1,
        iv_load_policy: 3
      },
      events: {
        onReady: event => {
          ytReady = true;
          if (pendingVideoId) {
            try {
              event.target.loadVideoById(pendingVideoId);
              if (pendingAutoplay) event.target.playVideo();
            } finally {
              pendingVideoId = '';
              pendingAutoplay = false;
            }
          }
        },
        onStateChange: event => {
          if (!window.YT?.PlayerState) return;
          if (event.data === YT.PlayerState.PLAYING) isPlaying = true;
          if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.CUED) isPlaying = false;
          updatePlayPauseIcon();

          if (event.data === YT.PlayerState.ENDED) {
            isPlaying = false;
            updatePlayPauseIcon();
            setTimeout(playNext, 120);
          }
        },
        onError: () => {
          isPlaying = false;
          updatePlayPauseIcon();
          showToast('이 YouTube 영상은 현재 웹에서 재생할 수 없습니다.');
        }
      }
    });
  }

  miniToggle.addEventListener('click', () => {
    // 초기 하단 바는 JSON의 mini 곡(Amen)을 독립적으로 재생한다.
    if (currentTrackId === '__mini__') {
      if (!ytReady || !ytPlayer) {
        playMiniTrack();
        return;
      }
      try {
        if (isPlaying) ytPlayer.pauseVideo();
        else ytPlayer.playVideo();
      } catch (_) {
        playMiniTrack();
      }
      return;
    }

    if (currentQueueIndex < 0) {
      playMiniTrack();
      return;
    }
    if (!ytReady || !ytPlayer) {
      playQueueIndex(currentQueueIndex);
      return;
    }
    try {
      if (isPlaying) ytPlayer.pauseVideo();
      else ytPlayer.playVideo();
    } catch (_) {
      playQueueIndex(currentQueueIndex);
    }
  });

  miniNext.addEventListener('click', playNext);

  document.getElementById('backBtn').addEventListener('click', () => {
    if (history.length > 1) history.back();
  });

  document.getElementById('shareBtn').addEventListener('click', async () => {
    const shareData = { title: document.title, url: location.href };
    try {
      if (navigator.share) await navigator.share(shareData);
      else if (navigator.clipboard) {
        await navigator.clipboard.writeText(location.href);
        showToast('현재 주소를 복사했습니다.');
      }
    } catch (_) {}
  });

  // 키보드 및 OS 미디어 제어도 가능하도록 보조한다.
  document.addEventListener('keydown', event => {
    if (event.code === 'Space' && !/INPUT|TEXTAREA|BUTTON/.test(document.activeElement?.tagName || '')) {
      event.preventDefault();
      miniToggle.click();
    }
  });

  if ('mediaSession' in navigator) {
    try {
      navigator.mediaSession.setActionHandler('play', () => miniToggle.click());
      navigator.mediaSession.setActionHandler('pause', () => miniToggle.click());
      navigator.mediaSession.setActionHandler('nexttrack', playNext);
      navigator.mediaSession.setActionHandler('previoustrack', playPrevious);
    } catch (_) {}
  }

  fetch(JSON_URL, { cache:'no-store' })
    .then(response => {
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.json();
    })
    .then(json => {
      data = json;
      render();
      // API는 미리 준비해 두어 모바일 Safari에서도 첫 탭 재생 성공률을 높인다.
      loadYouTubeAPI();
    })
    .catch(error => {
      console.error(error);
      app.innerHTML = '<div class="error"><strong>재생목록을 불러오지 못했습니다.</strong>GitHub에는 <code>index.html</code>과 <code>apple-music-maker.json</code>을 같은 폴더에 올려 주세요.</div>';
      updatePlayPauseIcon();
    });

  updatePlayPauseIcon();
})();
</script>
</body>
</html>
