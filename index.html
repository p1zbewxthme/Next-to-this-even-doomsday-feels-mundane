<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>우리가 구사했던 사랑을 기억해?</title>
  <style>
    :root {
      --accent:#fa243c;
      --text:#111214;
      --sub:#6e6e73;
      --line:rgba(60,60,67,.16);
      --glass:rgba(248,248,250,.84);
      --safe-b:env(safe-area-inset-bottom,0px);
      --safe-t:env(safe-area-inset-top,0px);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;background:#f1f1f3;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
    body{min-height:100dvh;overflow:hidden}
    button{font:inherit}
    .stage{height:100dvh;min-height:-webkit-fill-available;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(180deg,#fbe8c8 0%,#fff 100%)}
    .phone{position:relative;width:min(100%,430px);height:min(920px,calc(100dvh - 40px));background:#fff;border:10px solid #090909;border-radius:52px;overflow:hidden;box-shadow:0 20px 65px rgba(0,0,0,.2);isolation:isolate}
    .screen{position:absolute;inset:0;background:linear-gradient(180deg,#fbe8c8 0,#fff 35%);overflow:hidden}
    .status{height:44px;padding:8px 18px 0;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:650;position:relative;z-index:5;user-select:none}
    .status-right{display:flex;gap:8px;align-items:center;font-size:12px}
    .nav{height:44px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:5}
    .nav button{border:0;background:transparent;color:var(--accent);padding:8px;border-radius:50%;font-size:23px;line-height:1;touch-action:manipulation}
    .nav .right{display:flex;gap:4px}
    .scroll{position:absolute;left:0;right:0;top:88px;bottom:82px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;touch-action:pan-y;padding:0 16px 34px;scrollbar-width:none}
    .scroll::-webkit-scrollbar{display:none}
    .hero{padding:8px 2px 10px;text-align:center}
    .cover{width:min(72vw,270px);aspect-ratio:1;border-radius:12px;object-fit:cover;box-shadow:0 12px 30px rgba(0,0,0,.16);display:block;margin:0 auto 18px;background:#ddd}
    .title{font-size:22px;font-weight:760;letter-spacing:-.02em;margin:0 0 3px}
    .artist{font-size:17px;color:var(--accent);margin:0}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 16px}
    .action{border:0;border-radius:11px;background:rgba(255,255,255,.78);height:46px;color:var(--accent);font-weight:700;font-size:16px;box-shadow:0 1px 0 rgba(0,0,0,.03);touch-action:manipulation}
    .tracks{border-top:1px solid var(--line)}
    .track{width:100%;display:grid;grid-template-columns:52px minmax(0,1fr) 30px;gap:11px;align-items:center;min-height:65px;padding:6px 2px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;color:inherit;touch-action:pan-y;cursor:pointer}
    .track:active{background:rgba(118,118,128,.08)}
    .track.active .track-title,.track.active .play-mark{color:var(--accent)}
    .art{width:52px;height:52px;border-radius:7px;object-fit:cover;background:#e5e5e7}
    .meta{min-width:0}
    .track-title,.track-artist{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .track-title{font-size:15.5px;font-weight:520;letter-spacing:-.01em}
    .track-artist{margin-top:2px;color:var(--sub);font-size:13.5px}
    .play-mark{color:#9a9aa0;font-size:16px;text-align:center}
    .bottom-ui{position:absolute;left:0;right:0;bottom:0;z-index:15;padding-bottom:var(--safe-b);background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--line)}
    .mini{height:44px;display:flex;align-items:center;gap:9px;padding:5px 14px;border-bottom:1px solid var(--line)}
    .mini-art{width:34px;height:34px;border-radius:5px;object-fit:cover;background:#ddd;flex:none}
    .mini-meta{min-width:0;flex:1}
    .mini-title{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .mini-artist{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .mini-toggle{width:38px;height:38px;border:0;background:transparent;font-size:21px;touch-action:manipulation}
    .tabs{height:37px;display:flex;justify-content:space-around;align-items:center;color:#777;font-size:10px;font-weight:600}
    .tabs span.active{color:var(--accent)}

    .player-sheet{position:absolute;left:0;right:0;bottom:82px;z-index:12;background:#101010;transform:translateY(calc(100% + 2px));transition:transform .28s ease;box-shadow:0 -12px 30px rgba(0,0,0,.2)}
    .player-sheet.open{transform:translateY(0)}
    .player-head{height:38px;display:flex;align-items:center;gap:8px;padding:0 10px;color:#fff;background:#171717}
    .player-head strong{min-width:0;flex:1;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .player-close{border:0;background:#2c2c2e;color:#fff;border-radius:14px;width:28px;height:28px;font-size:17px;touch-action:manipulation}
    .yt-wrap{width:100%;height:max(200px,56.25vw);max-height:242px;background:#000}
    #yt-player,.yt-wrap iframe{display:block;width:100%!important;height:100%!important;border:0}
    .player-spacer{height:0;transition:height .28s ease}
    .scroll.player-open .player-spacer{height:calc(max(200px,56.25vw) + 48px)}

    .loading,.error{padding:30px 18px;text-align:center;color:var(--sub);line-height:1.55}
    .error strong{display:block;color:#111;margin-bottom:6px}

    @media (max-width:600px){
      body{background:#fff}
      .stage{padding:0;background:#fff;display:block}
      .phone{width:100%;height:100dvh;max-height:none;border:0;border-radius:0;box-shadow:none}
      .status{padding-top:max(8px,var(--safe-t));height:calc(44px + var(--safe-t))}
      .nav{height:44px}
      .scroll{top:calc(88px + var(--safe-t));bottom:calc(82px + var(--safe-b));padding-left:14px;padding-right:14px}
      .player-sheet{bottom:calc(82px + var(--safe-b))}
      .cover{width:min(68vw,270px)}
      .track{min-height:68px}
      .art{width:54px;height:54px}
      .player-sheet{transition:transform .22s ease}
    }
    @media (prefers-reduced-motion:reduce){.player-sheet,.player-spacer{transition:none}}
  </style>
</head>
<body>
  <main class="stage">
    <section class="phone" aria-label="Apple Music 스타일 재생목록">
      <div class="screen">
        <header class="status" id="statusBar"><span id="clock">9:41</span><span class="status-right"><span>▮▮▮▮</span><span>◉</span><span>100%</span></span></header>
        <nav class="nav" aria-label="상단 메뉴"><button type="button" aria-label="뒤로">‹</button><div class="right"><button type="button" aria-label="공유">⌁</button><button type="button" aria-label="더 보기">•••</button></div></nav>

        <div class="scroll" id="scrollPane">
          <div id="app"><div class="loading">재생목록을 불러오는 중…</div></div>
          <div class="player-spacer" aria-hidden="true"></div>
        </div>

        <section class="player-sheet" id="playerSheet" aria-label="YouTube 재생 영역">
          <div class="player-head"><strong id="playerTitle">재생 중</strong><button class="player-close" id="closePlayer" type="button" aria-label="플레이어 닫기">×</button></div>
          <div class="yt-wrap"><div id="yt-player"></div></div>
        </section>

        <footer class="bottom-ui">
          <div class="mini">
            <img class="mini-art" id="miniArt" alt="" />
            <div class="mini-meta"><div class="mini-title" id="miniTitle">곡을 선택해 주세요</div><div class="mini-artist" id="miniArtist">재생목록</div></div>
            <button class="mini-toggle" id="miniToggle" type="button" aria-label="재생 또는 일시정지">▶</button>
          </div>
          <div class="tabs" aria-hidden="true"><span>지금 듣기</span><span>둘러보기</span><span class="active">보관함</span><span>검색</span></div>
        </footer>
      </div>
    </section>
  </main>

<script>
(() => {
  'use strict';
  const JSON_URL = './apple-music-maker.json';
  const app = document.getElementById('app');
  const scrollPane = document.getElementById('scrollPane');
  const sheet = document.getElementById('playerSheet');
  const miniArt = document.getElementById('miniArt');
  const miniTitle = document.getElementById('miniTitle');
  const miniArtist = document.getElementById('miniArtist');
  const miniToggle = document.getElementById('miniToggle');
  const playerTitle = document.getElementById('playerTitle');
  const closePlayer = document.getElementById('closePlayer');

  let data = null;
  let tracks = [];
  let activeIndex = -1;
  let ytPlayer = null;
  let ytReady = false;
  let pendingVideoId = null;
  let isPlaying = false;

  const esc = s => String(s ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const videoId = url => {
    if (!url) return '';
    try {
      const u = new URL(url);
      if (u.hostname.includes('youtu.be')) return u.pathname.split('/').filter(Boolean)[0] || '';
      if (u.hostname.includes('youtube.com')) return u.searchParams.get('v') || u.pathname.split('/embed/')[1]?.split('/')[0] || '';
    } catch (_) {}
    return '';
  };

  function render() {
    const pl = data.pl || {};
    tracks = Array.isArray(data.tracks) ? data.tracks : [];
    document.documentElement.style.setProperty('--accent', data.tab?.accent || '#fa243c');
    document.title = pl.title || '재생목록';
    document.getElementById('clock').textContent = data.status?.time || '9:41';

    app.innerHTML = `
      <section class="hero">
        <img class="cover" src="${pl.img || ''}" alt="${esc(pl.title || '재생목록')} 표지" />
        <h1 class="title">${esc(pl.title || '')}</h1>
        <p class="artist">${esc(pl.artist || '')}</p>
      </section>
      <div class="actions"><button class="action" type="button" id="playFirst">▶ 재생</button><button class="action" type="button" id="shuffle">⤨ 임의 재생</button></div>
      <section class="tracks" aria-label="곡 목록">
        ${tracks.map((t,i)=>`
          <button class="track" type="button" data-index="${i}" aria-label="${esc(t.title)} 재생">
            <img class="art" src="${t.img || ''}" alt="" loading="lazy" decoding="async" />
            <span class="meta"><span class="track-title">${esc(t.title)}</span><span class="track-artist">${esc(t.artist)}</span></span>
            <span class="play-mark" aria-hidden="true">▶</span>
          </button>`).join('')}
      </section>`;

    app.querySelectorAll('.track').forEach(el => el.addEventListener('click', () => playTrack(Number(el.dataset.index))));
    document.getElementById('playFirst').addEventListener('click', () => playTrack(0));
    document.getElementById('shuffle').addEventListener('click', () => playTrack(Math.floor(Math.random()*tracks.length)));

    const mini = data.mini || {};
    miniArt.src = mini.img || pl.img || tracks[0]?.img || '';
    miniTitle.textContent = mini.title || '곡을 선택해 주세요';
    miniArtist.textContent = mini.artist || pl.artist || '재생목록';
  }

  function setActive(i) {
    activeIndex = i;
    document.querySelectorAll('.track').forEach((el,idx)=>{
      el.classList.toggle('active', idx===i);
      el.setAttribute('aria-current', idx===i ? 'true' : 'false');
      const mark = el.querySelector('.play-mark');
      if (mark) mark.textContent = idx===i && isPlaying ? 'Ⅱ' : '▶';
    });
    const t = tracks[i];
    if (t) {
      miniArt.src = t.img || data.pl?.img || '';
      miniTitle.textContent = t.title || '';
      miniArtist.textContent = t.artist || '';
      playerTitle.textContent = `${t.title || ''} — ${t.artist || ''}`;
    }
  }

  function openSheet(){ sheet.classList.add('open'); scrollPane.classList.add('player-open'); }
  function stopAndClose(){
    if (ytPlayer && ytReady) ytPlayer.stopVideo();
    isPlaying = false;
    miniToggle.textContent = '▶';
    sheet.classList.remove('open');
    scrollPane.classList.remove('player-open');
    setActive(activeIndex);
  }

  function playTrack(i) {
    const t = tracks[i];
    if (!t) return;
    const id = videoId(t.yt);
    if (!id) { alert('이 곡에는 재생 가능한 YouTube 링크가 없습니다.'); return; }
    isPlaying = true;
    setActive(i);
    openSheet();
    miniToggle.textContent = 'Ⅱ';
    if (ytReady && ytPlayer) {
      ytPlayer.loadVideoById(id);
      ytPlayer.playVideo();
    } else {
      pendingVideoId = id;
      loadYouTubeAPI();
    }
  }

  function loadYouTubeAPI(){
    if (window.YT && window.YT.Player) { createPlayer(); return; }
    if (document.getElementById('yt-api')) return;
    const s=document.createElement('script'); s.id='yt-api'; s.src='https://www.youtube.com/iframe_api'; document.head.appendChild(s);
  }

  window.onYouTubeIframeAPIReady = createPlayer;
  function createPlayer(){
    if (ytPlayer || !window.YT?.Player) return;
    ytPlayer = new YT.Player('yt-player', {
      width:'100%', height:'100%', videoId: pendingVideoId || '',
      playerVars:{playsinline:1,controls:1,rel:0,fs:1},
      events:{
        onReady:(e)=>{
          ytReady=true;
          if (pendingVideoId) { e.target.loadVideoById(pendingVideoId); e.target.playVideo(); pendingVideoId=null; }
        },
        onStateChange:(e)=>{
          isPlaying = e.data === YT.PlayerState.PLAYING;
          if (e.data === YT.PlayerState.PAUSED || e.data === YT.PlayerState.ENDED) isPlaying=false;
          miniToggle.textContent = isPlaying ? 'Ⅱ' : '▶';
          setActive(activeIndex);
        },
        onError:()=>{ isPlaying=false; miniToggle.textContent='▶'; }
      }
    });
  }

  miniToggle.addEventListener('click',()=>{
    if (activeIndex < 0) { playTrack(0); return; }
    openSheet();
    if (!ytPlayer || !ytReady) { playTrack(activeIndex); return; }
    if (isPlaying) ytPlayer.pauseVideo(); else ytPlayer.playVideo();
  });
  closePlayer.addEventListener('click', stopAndClose);

  fetch(JSON_URL, {cache:'no-store'})
    .then(r => { if(!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
    .then(j => { data=j; render(); })
    .catch(err => {
      console.error(err);
      app.innerHTML = `<div class="error"><strong>재생목록을 불러오지 못했습니다.</strong>GitHub에는 <code>index.html</code>과 <code>apple-music-maker.json</code>을 같은 폴더에 올려 주세요.<br>로컬에서 파일을 직접 더블클릭하면 브라우저 보안 정책 때문에 JSON 읽기가 차단될 수 있습니다.</div>`;
    });
})();
</script>
</body>
</html>
